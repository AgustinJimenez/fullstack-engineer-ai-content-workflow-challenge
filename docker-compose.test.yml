# Docker Compose configuration for testing

services:
  test-db:
    image: postgres:15
    container_name: ai-content-test-db
    environment:
      POSTGRES_DB: ai_content_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-content-test-backend
    environment:
      - NODE_ENV=test
      - PORT=8080
      - DB_HOST=test-db
      - DB_PORT=5432
      - DB_NAME=ai_content_test
      - DB_USER=postgres
      - DB_PASS=postgres
      - FRONTEND_URL=http://localhost:3001
    ports:
      - "8081:8080"
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - test-network
    command: ["npm", "test"]
    volumes:
      - ./backend/coverage:/app/coverage

  test-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-content-test-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
      - NODE_ENV=test
    ports:
      - "3001:3000"
    depends_on:
      - test-backend
    networks:
      - test-network
    # Override to run in dev mode for E2E testing
    command: ["npm", "run", "dev"]

volumes:
  test_postgres_data:

networks:
  test-network:
    driver: bridge