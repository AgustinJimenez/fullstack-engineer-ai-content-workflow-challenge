apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-content-backend-config
  namespace: ai-content-workflow
  labels:
    app: ai-content-backend
    component: config
data:
  # Application settings
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  
  # Database settings (non-sensitive)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "ai_content_workflow"
  DB_SSL: "true"
  DB_POOL_MIN: "5"
  DB_POOL_MAX: "20"
  DB_CONNECTION_TIMEOUT: "60000"
  
  # Frontend integration
  FRONTEND_URL: "https://app.example.com"
  ENABLE_CORS: "true"
  
  # AI service settings
  AI_TIMEOUT: "30000"
  AI_RATE_LIMIT: "60"
  USE_FAKE_AI: "false"
  
  # GraphQL settings
  ENABLE_GRAPHQL_PLAYGROUND: "false"
  
  # Monitoring settings
  ENABLE_METRICS: "true"
  HEALTH_CHECK_ENABLED: "true"
  ENABLE_DETAILED_HEALTH_CHECKS: "true"
  
  # Security settings
  HELMET_CSP_ENABLED: "true"
  API_RATE_LIMIT: "500"
  
  # LangChain settings
  LANGCHAIN_VERBOSE: "false"
  LANGCHAIN_CACHE_ENABLED: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ai-content-workflow
  labels:
    app: postgres
    component: config
data:
  POSTGRES_DB: "ai_content_workflow"
  POSTGRES_USER: "postgres"