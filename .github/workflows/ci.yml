name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  GO_VERSION: '1.21'

jobs:
  # Backend API Tests
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_content_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Run backend linting
      run: |
        cd backend
        npm run lint

    - name: Run backend unit tests
      run: |
        cd backend
        npm test -- --testPathIgnorePatterns=integration
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: ai_content_test
        DB_USER: postgres
        DB_PASS: postgres

    # TODO: Re-enable integration tests after fixing app.address supertest compatibility issue
    # - name: Run backend integration tests
    #   run: |
    #     cd backend
    #     npm run test:integration
    #   env:
    #     NODE_ENV: test
    #     DB_HOST: localhost
    #     DB_PORT: 5432
    #     DB_NAME: ai_content_test
    #     DB_USER: postgres
    #     DB_PASS: postgres

    - name: Generate backend coverage report (unit tests only)
      run: |
        cd backend
        npm test -- --coverage --testPathIgnorePatterns=integration
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: ai_content_test
        DB_USER: postgres
        DB_PASS: postgres

    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage/lcov.info
        flags: backend

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint

    - name: Run frontend type checking
      run: |
        cd frontend
        npx tsc --noEmit

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Run frontend unit tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./frontend/coverage/lcov.info
        flags: frontend

  # E2E Tests with Playwright
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install root dependencies
      run: npm ci

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Start Docker services
      run: |
        AI_PROVIDER=fake docker compose up --build -d
        echo "Waiting for containers to start..."
        sleep 10
        echo "Docker containers status:"
        docker ps -a
      env:
        AI_PROVIDER: fake

    - name: Check Docker logs
      if: always()
      run: |
        echo "=== Backend Logs ==="
        docker logs ai-content-backend || true
        echo "=== Frontend Logs ==="
        docker logs ai-content-frontend || true
        echo "=== Database Logs ==="
        docker logs ai-content-db || true

    - name: Wait for database to be ready
      run: |
        echo "Waiting for database to be ready..."
        timeout 60s bash -c 'until docker exec ai-content-db pg_isready -U postgres; do echo "Database not ready, retrying..."; sleep 2; done'
        echo "Database is ready!"
        
    - name: Debug database connection
      run: |
        echo "Testing database connection from backend container..."
        docker exec ai-content-backend psql -h db -U postgres -d ai_content_workflow -c "SELECT 1;" || echo "Database connection failed"
        echo "Backend environment variables:"
        docker exec ai-content-backend env | grep -E "(DB_|NODE_ENV|AI_PROVIDER)"
        
    - name: Wait for services to be ready
      run: |
        # First check if backend is alive (basic liveness check)
        echo "Waiting for backend to be alive..."
        timeout 60s bash -c 'until curl -f http://localhost:8080/health/live; do echo "Backend not alive, retrying..."; sleep 2; done'
        echo "Backend is alive!"
        
        # For CI, just use the liveness check and proceed - full health may depend on external services
        echo "Backend is alive, proceeding with tests (skipping full health check for CI)..."
        
        # Wait for frontend
        echo "Waiting for frontend to be ready..."
        timeout 60s bash -c 'until curl -f http://localhost:3000; do echo "Frontend not ready, retrying..."; sleep 2; done'
        echo "Frontend is ready!"

    - name: Run E2E tests
      run: AI_PROVIDER=fake NO_WEB_SERVER=1 npx playwright test --workers=1 --reporter=line
      env:
        CI: true
        AI_PROVIDER: fake
        NO_WEB_SERVER: 1

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload E2E test videos and screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-artifacts
        path: test-results/
        retention-days: 7
        if-no-files-found: ignore

    - name: Show Docker logs on failure
      if: failure()
      run: |
        echo "=== Test Failed - Showing Docker Logs ==="
        echo "=== Backend Logs ==="
        docker logs ai-content-backend || true
        echo "=== Frontend Logs ==="
        docker logs ai-content-frontend || true
        echo "=== Database Logs ==="
        docker logs ai-content-db || true

    - name: Stop Docker services
      if: always()
      run: docker compose down

